services:
  mysql:
    image: mysql:8.4
    container_name: multimeios-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no arquivo .env da raiz}
    ports:
      - "3306:3306"
    volumes:
      - multimeios_mysql:/var/lib/mysql
      - ./database/schema/01_usuarios.sql:/docker-entrypoint-initdb.d/01_usuarios.sql:ro
      - ./database/schema/02_admin.sql:/docker-entrypoint-initdb.d/02_admin.sql:ro
      - ./database/schema/03_livros.sql:/docker-entrypoint-initdb.d/03_livros.sql:ro
      - ./database/seeds/01_demo.sql:/docker-entrypoint-initdb.d/04_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  multimeios_mysql:
